services:
  jenkins:
    build: .
    container_name: feedback-jenkins
    # root para poder usar el Docker de la PC a través del socket
    user: root
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file: .env
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /casc/casc.yaml
      KUBECONFIG: /kube/config
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./casc.yaml:/casc/casc.yaml:ro
      - ${KUBECONFIG_PATH}:/kube/config:ro

volumes:
  jenkins_home:
